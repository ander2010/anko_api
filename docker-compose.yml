x-anko-env: &anko-environment
  env_file:
    - .env

services:
  api:
    container_name: anko-api
    build: .
    <<: *anko-environment
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 anko_core.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - default
      - hope_default

  workflow-progress-worker:
    container_name: anko-workflow-progress-worker
    build: .
    <<: *anko-environment
    command: celery -A anko_core worker --loglevel=info -Q workflow-progress -n workflow-progress@%h
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - default
      - hope_default

networks:
  hope_default:
    external: true
